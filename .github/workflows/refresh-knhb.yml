name: Refresh KNHB Matches Daily

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC dagelijks
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check secrets (veilig — toont geen waardes)
        env:
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          if [ -z "$TURSO_TOKEN" ]; then
            echo "::error::TURSO_TOKEN secret is leeg of ontbreekt — check Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "TURSO_TOKEN ontvangen, lengte: ${#TURSO_TOKEN} tekens"
      - name: Refresh wedstrijden
        env:
          TURSO_URL: libsql://knhb-matchen-fjdfksadhfljsf.aws-eu-west-1.turso.io
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: node refresh-matches.js
